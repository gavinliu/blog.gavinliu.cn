## Acrylic主题配置文件
############################################################################################################
# 为避免主题更新后，配置文件被覆盖，请复制一份此文件到站点根目录下的_config.Acrylic.yml文件中，修改_config.Acrylic.yml文件中的配置
############################################################################################################
# 修改此文件前，请仔细阅读官方文档：https://next-docs.acrylic.org.cn/
############################################################################################################

# 站点设置
site:
  name: # 左上角显示内容
    class: i_class #i_class/text/img
    custom: fa-solid fa-ghost #自定义内容
  siteIcon: /img/favicon.png # 网页icon
  icon: /img/favicon.png # 页脚的icon、加载动画默认的icon
  icp: # ICP

# 导航栏
nav:
  #导航栏左侧
  left:
    enable: true
    menu:
      我的:
        博客:
          icon: /img/favicon.png
          url: /
  # 导航栏内容
  menu:
    文库:
      url: false
      child:
        文章列表:
          url: /archives/
          icon: fa-solid fa-box-archive
        全部分类:
          url: /categories/
          icon: fa-solid fa-cube
        全部标签:
          url: /tags/
          icon: fa-solid fa-tags
    # 专栏:
    #   url: false
    #   child:
    #     Android 开发日常:
    #       url: /tags/Android/
    #       icon: fa-solid fa-mobile
    我的:
      url: false
      child:
        我的装备:
          url: /equipment/
          icon: fa-solid fa-laptop
        关于我:
          url: /about/
          icon: fa-solid fa-user

  # 导航栏右侧快捷菜单
  right: # @todo 允许用户自定义
    travellings: false #开往
    random: true #
    console: false #控制台

# heo式顶部一大坨
hometop:
  bbtime: true

  banner:
    enable: true
    title: 代码人生<br>与科技生活
    url: GAVINLIU.CN
    icon:
      Android:
        img: /img/icon/Android.png
        color: "#ffffff"
      Apple:
        img: /img/icon/Apple.svg
        color: "#ffffff"
      Java:
        img: /img/icon/Java.png
        color: "#ffffff"
      Kotlin:
        img: /img/icon/Kotlin.png
        color: "#27282c"
      Python:
        img: /img/icon/Python.png
        color: "#ffffff"
      Swift:
        img: /img/icon/Swift.png
        color: "#eb6840"
      HTML:
        img: /img/icon/HTML.png
        color: "#e9572b"
      CSS3:
        img: /img/icon/CSS3.png
        color: "#2c51db"
      JS:
        img: /img/icon/JS.png
