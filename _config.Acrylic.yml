        color: "#ffffff"
      AE:
        img: /img/icon/ae.png
        color: "#989bf8"
      PS:
        img: /img/icon/ps.png
        color: "#4082c3"

  categoryGroup:
    G1:
      name: 必看精选
      icon: fa-solid fa-star
      url: /tags/必看精选/
    G2:
      name: 代码人生
      icon: fa-solid fa-code
      url: /tags/代码人生/
    G3:
      name: 科技生活
      icon: fa-solid fa-microchip
      url: /tags/科技生活/

  recommendList:
    sup: 新品推荐
    title: Snapmod
    url: /2018/07/16/90a0e986eb9b.html
    img: /img/recommend_banner.png
    color: "#4a4a4a"

# 个人卡片
aside:
  home:
    noSticky: "about,flip"
    Sticky: "newestPost,allInfo"
  post:
    noSticky: "about"
    Sticky: "newestPost"
  page:
    noSticky: "about,flip"
    Sticky: "newestPost,allInfo"

  card:
    avatar: /img/avatar.png
    content: 这有关于<b>开发</b>、<b>技术</b>相关的问题和看法，还有关于<b>数码产品</b>相关的教程和测评。<br/><br/>相信你可以在这里找到对你有用的知识和教程。
    information:
      Github:
        icon: fa-brands fa-github
        url: https://github.com/gavinliu
      Mail:
        icon: fa-solid fa-envelope
        url: mailto:gavin6liu@gmail.com
    button:
      text: 更多信息
      url: /about

  flip:
    color: "#0099FF"
    face:
      title: QQ群
      desc: 加入官方QQ群与我们交流
    backface:
      title: 扫一扫
      desc: 获取最新信息和帮助
      img: /img/qqgroup.png

  toc:
    post: true
    page: false

  # 建站时间
  siteinfo:
    postcount: true
    wordcount: true
    pv: false
    uv: false
    updatetime: false
    runtimeenable: true
    runtime: "2012-02-28 00:00:00"

