  randomlink: false

  cdn:
    url:
    desc:
  rss:
    url: /atom.xml
  license:
    url: https://creativecommons.org/licenses/by/4.0/
    icon: fas fa-closed-captioning

page:
  error: true
  tags: true
  categories: true
  default:
    cover: /img/cover/default.png

# 文章页默认设置
post:
  default:
    cover: /img/cover/default.png
    locate: 成都
    copyright: 原创
    excerpt: 100
  meta:
    date: true
    updated: false
    locate: true
    wordcount: true
    readtime: true
    pv: false
    comment: false
  award:
    enable: false
    wechat:
    alipay:
    url:
  covercolor: #文章cover取色
    enable: true
    local: true

# 关于界面
about: true

# 404页面
errorpage:
  img: /img/acrylic.png
  text: =awa= 页面走丢了
  recommendList: true

# 懒加载
lazyload:
  enable: false
  placeholder: /img/acrylic.png
  errorimg: /img/acrylic.png

# 图片灯箱
lightbox: true

#代码高亮增强
hightlight:
  enable: true
  hightlimit: 200

# 加载动画
loading:
  fullpage: false
  pace: true

# 第三方设置
thirdparty:
  wordcount: true

  busuanzi:
    enable: false
    usecomment: false #当评论系统开启时文章页面使用评论系统的统计数据

  search:
    algolia_search:
      enable: false
      # hits:
      #   per_page: 6
    local_search:
      enable: false
      preload: false
      CDN:

  aplayer:
    enable: false
    server: tencent
    id: 1708664797

  consolePlus: false

# 评论
comment:
  enable: false
  twikoo:
    envId:
    # region: ap-shanghai
    path: window.location.pathname

# 插入代码到头部 </head> 之前 和 底部 </body> 之前
